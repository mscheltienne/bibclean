[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools >= 76.0.0', 'setuptools_scm>=10.2.1']

[dependency-groups]
doc = [
  'furo',
  'intersphinx_registry',
  'numpydoc',
  'sphinx-copybutton',
  'sphinx-design',
  'sphinx-issues',
  'sphinx>=9.0',
]
ide = [
  'ipykernel',
  'ipython',
]
style = [
  'codespell[toml]>=2.4.3',
  'pre-commit',
  'ruff>=0.16.5',
  'toml-sort',
  'yamllint',
]
test = [
  'psutil',
  'pytest-cov',
  'pytest-randomly',
  'pytest-timeout',
  'pytest>=9.1.1',
]

[project]
authors = [
  {email = 'mathieu.scheltienne@gmail.com', name = 'Mathieu Scheltienne'},
]
classifiers = [
  'Intended Audience :: Developers',
  'Natural Language :: English',
  'Operating System :: MacOS',
  'Operating System :: Microsoft :: Windows',
  'Operating System :: Unix',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
]
dependencies = [
  'bibtexparser>=1.4.0,<2',
  'click',
  'packaging',
]
description = 'A simple BibTeX file checker and cleaner.'
dynamic = ["version"]
keywords = [
  'bibliography',
  'bibtex',
  'python',
]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [
  {email = 'mathieu.scheltienne@gmail.com', name = 'Mathieu Scheltienne'},
]
name = 'bibclean'
readme = 'README.md'
requires-python = '>=3.11'

[project.scripts]
bibclean = 'bibclean._commands.main:run'

[project.urls]
documentation = 'https://mscheltienne.github.io/bibclean/'
homepage = 'https://github.com/mscheltienne/bibclean'
source = 'https://github.com/mscheltienne/bibclean'
tracker = 'https://github.com/mscheltienne/bibclean/issues'

[tool.codespell]
check-filenames = true
check-hidden = true
ignore-words = '.codespellignore'
skip = 'build,.git,.mypy_cache,.pytest_cache,.venv'

[tool.coverage.report]
exclude_lines = [
  'if __name__ == .__main__.:',
  'if TYPE_CHECKING:',
  'pragma: no cover',
]
precision = 2

[tool.coverage.run]
branch = true
cover_pylib = false
omit = [
  '**/__init__.py',
  '**/bibclean/_version.py',
  '**/bibclean/utils/_fixes.py',
]

[tool.pytest.ini_options]
addopts = ['--color=yes', '--cov-report=', '--durations=20', '--junit-xml=junit-results.xml', '--strict-config', '--tb=short', '-ra', '-v']
filterwarnings = [
  'error',
  # bibtexparser 1.4 builds its pyparsing grammar at parse time; pyparsing >= 3.1 turns
  # its diagnostics into warnings when the filters escalate them. Both are upstream
  # noise, not bibclean bugs, and disappear with bibtexparser in the redesign step.
  'ignore::pyparsing.warnings.PyparsingDeprecationWarning',
  'ignore::pyparsing.warnings.PyparsingDiagnosticWarning',
]
junit_family = 'xunit2'
minversion = '8.0'

[tool.ruff]
extend-exclude = []
line-length = 88

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = []
logger-objects = ["bibclean.utils.logs.logger"]
select = ['A', 'B', 'C4', 'D', 'E', 'F', 'G', 'I', 'LOG', 'NPY', 'PERF', 'PIE', 'PT', 'T20', 'TID', 'UP', 'W']

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
'*' = [
  'B904',  # 'Within an except clause, raise exceptions with raise ... from ...'
  'D100',  # 'Missing docstring in public module'
  'D104',  # 'Missing docstring in public package'
  'D107',  # 'Missing docstring in __init__'
]
'__init__.py' = ['F401', 'I002']

[tool.ruff.lint.pydocstyle]
convention = 'numpy'
ignore-decorators = ["bibclean.utils._docs.copy_doc"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"bibclean.config" = ["*.toml"]

[tool.setuptools.packages.find]
include = ['bibclean*']
where = ['src']

[tool.setuptools_scm]
version_file = "src/bibclean/_version.py"
version_scheme = "release-branch-semver"

[tool.setuptools_scm.scm.git]
pre_parse = "fetch_on_shallow"

[tool.tomlsort]
all = true
ignore_case = true
spaces_before_inline_comment = 2
trailing_comma_inline_array = true

[tool.uv]
default-groups = "all"
